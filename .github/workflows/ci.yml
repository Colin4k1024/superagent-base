name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: opencoze
          MYSQL_USER: coze
          MYSQL_PASSWORD: coze123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
          check-latest: true
      - name: Build
        run: cd backend && go build ./...
      - name: Vet
        run: cd backend && go vet ./...
      - name: Test
        run: cd backend && go test -gcflags="all=-l -N" ./... -count=1 -timeout 120s
        env:
          MYSQL_DSN: "coze:coze123@tcp(127.0.0.1:3306)/opencoze?charset=utf8mb4&parseTime=True"
          REDIS_ADDR: "127.0.0.1:6379"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmmirror.com/
          # Replace internal registry URLs in lockfile with public mirror
          sed -i 's|http://nexus.haier.net/repository/dts-npm-group/|https://registry.npmmirror.com/|g' web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Type check + Build
        run: cd web && npm run build
      - name: Unit tests
        run: cd web && npx vitest run

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -f Dockerfile.production -t superagent-base:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint ./helm/charts/superagent
