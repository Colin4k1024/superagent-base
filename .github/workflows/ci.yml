name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
          check-latest: true
      - name: Build
        run: cd backend && go build ./...
      - name: Vet
        run: cd backend && go vet ./...
      - name: Test
        run: cd backend && go test ./pkg/... -count=1 -timeout 60s

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmmirror.com/
          # Replace internal registry URLs in lockfile with public mirror
          sed -i 's|http://nexus.haier.net/repository/dts-npm-group/|https://registry.npmmirror.com/|g' web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Type check + Build
        run: cd web && npm run build
      - name: Unit tests
        run: cd web && npx vitest run

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -f Dockerfile.production -t superagent-base:ci .

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint ./helm/charts/superagent
