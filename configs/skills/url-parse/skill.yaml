name: url-parse
version: "1.0.0"
author: superagent-ai
description: Parses a URL and returns its components (scheme, host, path, query params, fragment).
tags:
  - utility
  - url
  - network
triggers:
  - "parse url"
  - "extract url"
  - "解析URL"
input:
  type: object
  required:
    - url
  properties:
    url:
      type: string
      description: The URL to parse, e.g. "https://example.com/path?k=v#anchor"
output:
  type: object
  properties:
    scheme:
      type: string
      description: URL scheme, e.g. "https"
    host:
      type: string
      description: Host including port if present, e.g. "example.com:8080"
    hostname:
      type: string
      description: Host without port
    port:
      type: string
      description: Port number as string, empty if not specified
    path:
      type: string
      description: URL path, e.g. "/api/v1/users"
    query:
      type: object
      description: Query parameters as key-value map
    fragment:
      type: string
      description: URL fragment (hash), without leading #
    valid:
      type: boolean
      description: Whether the URL parsed successfully
runtime:
  type: embedded
