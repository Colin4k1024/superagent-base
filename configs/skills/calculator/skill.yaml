name: calculator
version: "1.0.0"
author: superagent-ai
description: Evaluates a simple arithmetic expression supporting +, -, *, /, %, ^ operators.
tags:
  - utility
  - math
triggers:
  - "calculate"
  - "compute"
  - "math"
  - "计算"
input:
  type: object
  required:
    - expression
  properties:
    expression:
      type: string
      description: Arithmetic expression, e.g. "2 + 3 * 4", "100 / 5", "2 ^ 8"
output:
  type: object
  properties:
    result:
      type: number
      description: Numeric result of the expression
runtime:
  type: embedded
