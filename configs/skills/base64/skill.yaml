name: base64
version: "1.0.0"
author: superagent-ai
description: Encodes a string to Base64 or decodes a Base64 string back to plain text.
tags:
  - utility
  - encoding
triggers:
  - "base64 encode"
  - "base64 decode"
  - "encode base64"
  - "decode base64"
  - "Base64编码"
input:
  type: object
  required:
    - text
    - operation
  properties:
    text:
      type: string
      description: Input text to encode, or Base64 string to decode
    operation:
      type: string
      description: "encode or decode"
    url_safe:
      type: boolean
      description: Use URL-safe Base64 alphabet (replaces +/ with -_), default false
output:
  type: object
  properties:
    result:
      type: string
      description: Encoded Base64 string or decoded plain text
    valid:
      type: boolean
      description: Whether decode succeeded (decode operation only)
runtime:
  type: embedded
