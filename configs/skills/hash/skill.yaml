name: hash
version: "1.0.0"
author: superagent-ai
description: Computes MD5, SHA256, or SHA512 hash of an input string.
tags:
  - utility
  - security
  - crypto
triggers:
  - "hash"
  - "md5"
  - "sha256"
  - "checksum"
  - "计算哈希"
input:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      description: Input string to hash
    algorithm:
      type: string
      description: "Hash algorithm: md5, sha256, sha512 (default sha256)"
output:
  type: object
  properties:
    hash:
      type: string
      description: Hex-encoded hash digest
    algorithm:
      type: string
      description: Algorithm used
    input_length:
      type: integer
      description: Length of the input string in bytes
runtime:
  type: embedded
