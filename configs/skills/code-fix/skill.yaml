name: code-fix
version: "1.0.0"
author: superagent-ai
description: >
  Analyzes code errors, generates multiple fix solutions, evaluates and applies
  the best fix. Supports TEST_FAILURE, COMPILATION_ERROR, and RUNTIME_ERROR.
tags:
  - development
  - debugging
  - code-fix
triggers:
  - "fix this error"
  - "fix this bug"
  - "code fix"
  - "编码修复"
  - "fix test failure"
  - "compilation error"
input:
  type: object
  required:
    - errorType
    - errorMessage
  properties:
    errorType:
      type: string
      description: "One of: TEST_FAILURE, COMPILATION_ERROR, RUNTIME_ERROR"
    errorMessage:
      type: string
      description: The error message text
    errorLocation:
      type: object
      description: Where the error occurred
      properties:
        filePath:
          type: string
        lineNumber:
          type: integer
        columnNumber:
          type: integer
    stackTrace:
      type: string
      description: Full stack trace (optional)
output:
  type: object
  properties:
    executionStatus:
      type: string
      description: "SUCCESS or FAILED"
    modifiedFiles:
      type: array
      items:
        type: string
      description: List of files modified by the fix
    executionLog:
      type: string
      description: Summary of what was applied
runtime:
  type: process
  image: python3
  # Run from configs/skills/code-fix/:
  # python scripts/runner.py --error-type <type> --error-message <msg> --file <path> --line <n>
