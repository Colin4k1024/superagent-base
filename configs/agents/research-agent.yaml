apiVersion: superagent/v1
kind: Agent
metadata:
  name: research-agent
  version: "1.0.0"
  tags: [research, analysis]
  labels:
    team: core
    tier: production
spec:
  type: chat_model_agent
  model:
    primary: qwen-max
  system_prompt: |
    You are a professional research assistant. Help users analyze topics,
    find information, and provide well-structured summaries.
  # sandbox:
  #   enabled: true
  #   backend: docker            # docker | process (auto-fallback)
  #   timeout_seconds: 30
  #   memory_limit_mb: 256
  #   allow_net: ["*.openai.com", "*.google.com"]
  #   allow_read: ["/tmp/agent-workspace"]
  #   allow_write: ["/tmp/agent-workspace"]
  #   allow_env: ["API_KEY"]
  tools:
    - ref: builtin/web_search
    - ref: builtin/http_request
  memory:
    backend: mem0
    config:
      session_window: 20
  observability:
    tracing: true
    metrics: true
    log_level: info
  evolution:
    enabled: false        # set to true when EVOLUTION_ENABLED=true in env
    collect:
      - tool_success
      - tool_error
      - model_invoke
      - agent_done
    advise:
      min_confidence: 0.5
      max_suggestions: 3
