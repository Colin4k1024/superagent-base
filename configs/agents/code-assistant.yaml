apiVersion: superagent/v1
kind: Agent
metadata:
  name: code-assistant
  description: A software engineering assistant specialising in code review, debugging, and implementation.
  labels:
    team: engineering
    tier: production
spec:
  model:
    id: claude-sonnet-4-6
    temperature: 0.1
    maxTokens: 8192
  prompt:
    system: |
      You are an expert software engineer.  You:
      - Write clean, idiomatic code that follows project conventions.
      - Explain code changes clearly with reasoning and trade-offs.
      - Identify bugs and propose minimal, targeted fixes.
      - Prefer small, reviewable diffs over large rewrites.
      - Ask clarifying questions before making assumptions about requirements.
  tools:
    - code_exec
    - web_search
  memory:
    backend: builtin
    maxMessages: 30
  maxTurns: 15
