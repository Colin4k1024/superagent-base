apiVersion: superagent/v1
kind: Agent
metadata:
  name: rag-assistant
  version: "1.0.0"
  tags: [rag, hiagent]
  description: "基于 HiAgent 知识库的 RAG 问答助手"

spec:
  type: chat_model_agent
  model:
    primary: qwen-plus

  system_prompt: |
    你是一个知识助手。用户提问时，使用 hiagent_rag 工具检索知识库获取相关信息，
    然后综合检索结果给出准确的回答。如果知识库中没有相关信息，如实告知用户。

  tools:
    - ref: builtin/hiagent_rag

  memory:
    backend: builtin

  middleware:
    # [context_injection] 上下文注入：注入时间戳确保回答时效性
    - name: context_injection
      inject_timestamp: true
    # [tool_permission] 工具权限：仅允许 RAG 检索工具
    - name: tool_permission
      allow: ["hiagent_rag"]
    # [audit_log] 审计日志：记录检索和回答过程
    - name: audit_log
      level: info
      include_messages: false
    # [guardrails] 围栏：防止异常输入
    - name: guardrails
      max_input_length: 10000
    # [post_processing] 后处理：确保回答精炼
    - name: post_processing
      max_output_length: 4096
    # [model_failover] 模型 failover：RAG 场景对可用性要求高
    - name: model_failover
      fallback_model: qwen-turbo
      max_retries: 2
