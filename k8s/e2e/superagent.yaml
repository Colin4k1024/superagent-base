---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superagent-env
  namespace: superagent
data:
  LISTEN_ADDR: ":8888"
  GRPC_LISTEN_ADDR: ":50051"
  LOG_LEVEL: "info"
  MODEL_PROTOCOL_0: "openai"
  MODEL_NAME_0: "Qwen3-Coder-Next"
  MODEL_ID_0: "Qwen3-Coder-Next-4bit"
  MODEL_BASE_URL_0: "http://host.docker.internal:8000/v1"
  MODEL_API_KEY_0: "123456"
  MODEL_OPENCOZE_ID_0: "100001"
  BUILTIN_CM_TYPE: "openai"
  BUILTIN_CM_OPENAI_BASE_URL: "http://host.docker.internal:8000/v1"
  BUILTIN_CM_OPENAI_API_KEY: "123456"
  BUILTIN_CM_OPENAI_MODEL: "Qwen3-Coder-Next-4bit"
  BUILTIN_CM_OPENAI_BY_AZURE: "false"
  MYSQL_HOST: "mysql"
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "opencoze"
  MYSQL_USER: "coze"
  MYSQL_PASSWORD: "coze123"
  REDIS_ADDR: "redis:6379"
  REDIS_PASSWORD: ""
  STORAGE_TYPE: "minio"
  MINIO_AK: "minioadmin"
  MINIO_SK: "minioadmin123"
  MINIO_ENDPOINT: "minio:9000"
  STORAGE_BUCKET: "opencoze"
  VECTOR_STORE_TYPE: "none"
  COZE_MQ_TYPE: "none"
  AGENT_CONFIG_DIR: "/app/configs/agents"
  OTEL_ENABLED: "false"
  SERVICE_NAME: "superagent-base"
  EMBEDDING_TYPE: "openai"
  EMBEDDING_OPENAI_BASE_URL: "http://host.docker.internal:8000/v1"
  EMBEDDING_OPENAI_API_KEY: "123456"
  EMBEDDING_OPENAI_MODEL: "Qwen3-Coder-Next-4bit"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superagent
  namespace: superagent
  labels:
    app: superagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superagent
  template:
    metadata:
      labels:
        app: superagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: superagent
          image: localhost:5001/superagent-base:latest
          ports:
            - containerPort: 8888
              name: http
            - containerPort: 50051
              name: grpc
          envFrom:
            - configMapRef:
                name: superagent-env
          readinessProbe:
            httpGet:
              path: /ready
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: superagent
  namespace: superagent
spec:
  selector:
    app: superagent
  ports:
    - name: http
      port: 8888
      targetPort: 8888
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: superagent-nodeport
  namespace: superagent
spec:
  type: NodePort
  selector:
    app: superagent
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      nodePort: 30888
