apiVersion: superagent/v1
kind: Agent
metadata:
  name: e2e-workflow
  version: "1.0.0"
  tags: [e2e, test, workflow]
spec:
  type: workflow
  model:
    primary: Qwen3-Coder-Next-4bit
  system_prompt: "Research workflow for e2e testing"
  workflow:
    nodes:
      - id: research
        type: llm_call
        prompt: "List 3 key facts about the following topic in bullet points: "
        input_mapping:
          content: "$.message"

      - id: summarize
        type: llm_call
        prompt: "Summarize the following research into one concise paragraph (under 30 words):"
        input_mapping:
          content: "$.research.output"

    edges:
      - from: START
        to: research
      - from: research
        to: summarize
      - from: summarize
        to: END

    variables:
      - name: research_result
        from: research.output
      - name: summary
        from: summarize.output
