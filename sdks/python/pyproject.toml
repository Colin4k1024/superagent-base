[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superagent-sdk"
version = "0.1.0"
description = "Python SDK for Superagent — AI Agent development platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["ai", "agent", "llm", "superagent"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",
]

[tool.hatch.build.targets.wheel]
packages = ["superagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
