server {
    listen 80;
    server_name _;

    # Serve static build output
    root /usr/share/nginx/html;
    index index.html;

    # All unmatched paths fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy REST API to backend
    location /api/ {
        proxy_pass         http://coze-server:8888;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # SSE / streaming support
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       3600s;
    }

    # Proxy gRPC-web to backend gRPC port
    location /grpc/ {
        proxy_pass         http://coze-server:50051;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # Proxy Prometheus metrics endpoint
    location /metrics {
        proxy_pass       http://coze-server:8888/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Security headers
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
