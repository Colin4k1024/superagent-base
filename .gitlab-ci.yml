image: alpine:latest

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r docs/wiki/* public/
    - |
      cat > public/index.html << 'EOF'
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="UTF-8">
        <title>Superagent Base</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
      </head>
      <body>
        <div id="app"></div>
        <script>
          window.$docsify = {
            name: 'Superagent Base',
            repo: '',
            loadSidebar: true,
            subMaxLevel: 3,
            search: {
              placeholder: '搜索文档',
              noData: '没有找到结果',
            },
          }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
      </body>
      </html>
      EOF
    - cp public/Home.md public/README.md 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
