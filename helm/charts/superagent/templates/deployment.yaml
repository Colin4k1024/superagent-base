apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "superagent.fullname" . }}
  labels:
    {{- include "superagent.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "superagent.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "superagent.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: superagent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "superagent.fullname" . }}-config
            - secretRef:
                name: {{ if .Values.mysql.existingSecret }}{{ .Values.mysql.existingSecret }}{{ else }}{{ include "superagent.fullname" . }}-secret{{ end }}
          volumeMounts:
            - name: agent-configs
              mountPath: /app/configs/agents
              {{- if .Values.gitSync.enabled }}
              subPath: agents
              {{- else }}
              readOnly: true
              {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.gitSync.enabled }}
        - name: git-sync
          image: "{{ .Values.gitSync.image }}"
          args:
            - --repo={{ .Values.gitSync.repo }}
            - --root=/git
            - --period={{ .Values.gitSync.period }}
          volumeMounts:
            - name: agent-configs
              mountPath: /git
        {{- end }}
      volumes:
        - name: agent-configs
          {{- if .Values.gitSync.enabled }}
          emptyDir: {}
          {{- else }}
          configMap:
            name: {{ include "superagent.fullname" . }}-agents
          {{- end }}
